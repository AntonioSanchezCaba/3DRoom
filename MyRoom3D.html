<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Room in 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas {
            display: block;
        }
        
        .ui-overlay {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }
        
        .title {
            top: 30px;
            left: 40px;
            color: #fff;
        }
        
        .title h1 {
            font-family: 'Space Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #00d9ff, #ff00e5, #00d9ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease infinite;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
        }
        
        .title p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
            font-weight: 300;
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }
        
        .controls-hint {
            bottom: 30px;
            left: 40px;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }
        
        .controls-hint span {
            display: block;
            margin-bottom: 5px;
            font-family: 'Space Mono', monospace;
        }
        
        .controls-hint span::before {
            content: '→';
            margin-right: 10px;
            color: #00d9ff;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        .loading.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-text {
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            color: #00d9ff;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loading-bar::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #ff00e5);
            animation: loading-slide 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes loading-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 100;
            pointer-events: auto;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .theme-toggle:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-text">Cargando habitación...</div>
        <div class="loading-bar"></div>
    </div>
    
    <div class="ui-overlay title">
        <h1>My Room in 3D</h1>
        <p>AMC's Workspace</p>
    </div>
    
    <div class="ui-overlay controls-hint">
        <span>Arrastra para rotar</span>
        <span>Scroll para zoom</span>
        <span>Click derecho para mover</span>
    </div>
    
    <button class="theme-toggle" id="themeToggle">☀️ Modo Día</button>
    
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 1.8;
        
        camera.position.set(10, 8, 10);
        controls.target.set(0, 2, 0);
        
        // Helper functions
        function createBox(w, h, d, material, x, y, z) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }
        
        function createCylinder(rTop, rBot, h, segments, material, x, y, z) {
            const geometry = new THREE.CylinderGeometry(rTop, rBot, h, segments);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }
        
        // Materials with better colors matching the photo
        const mats = {
            // Room
            wallBeige: new THREE.MeshStandardMaterial({ color: 0xd4c8b8, roughness: 0.95, metalness: 0 }),
            floorTerrazo: new THREE.MeshStandardMaterial({ color: 0x9a9080, roughness: 0.6, metalness: 0.1 }),
            
            // Desk - blue/teal color
            deskBlue: new THREE.MeshStandardMaterial({ color: 0x5b9aa9, roughness: 0.4, metalness: 0.1 }),
            
            // Monitors
            monitorBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.7 }),
            screenMain: new THREE.MeshBasicMaterial({ color: 0x1a0a2a }),
            screenSecondary: new THREE.MeshBasicMaterial({ color: 0x2a3a4a }),
            
            // PC Case
            pcBlack: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.4, metalness: 0.6 }),
            pcGlass: new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2a, roughness: 0.1, metalness: 0.3, 
                transparent: true, opacity: 0.6 
            }),
            
            // Shelf
            shelfBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.1 }),
            
            // Chair
            chairGray: new THREE.MeshStandardMaterial({ color: 0x6a6a70, roughness: 0.8, metalness: 0 }),
            chairMetal: new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.4, metalness: 0.6 }),
            
            // Guitar
            guitarBody: new THREE.MeshStandardMaterial({ color: 0xc4a060, roughness: 0.35, metalness: 0.1 }),
            guitarNeck: new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.5, metalness: 0 }),
            guitarStrings: new THREE.MeshStandardMaterial({ color: 0xccccaa, roughness: 0.3, metalness: 0.8 }),
            
            // Fan
            fanBlack: new THREE.MeshStandardMaterial({ color: 0x202020, roughness: 0.5, metalness: 0.3 }),
            
            // Peripherals
            keyboardBlack: new THREE.MeshStandardMaterial({ color: 0x252525, roughness: 0.5, metalness: 0.2 }),
            mouseBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.3 }),
            mousepadGreen: new THREE.MeshStandardMaterial({ color: 0x5a7a3a, roughness: 0.9, metalness: 0 }),
            
            // Lamp
            lampMetal: new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.3, metalness: 0.8 }),
            
            // Weights
            weightBlack: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.4 }),
            weightRed: new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.5, metalness: 0.2 }),
        };
        
        // Book colors from the photo
        const bookColors = [
            0xcc4444, 0x44aa44, 0x4466cc, 0xeecc44, 0xcc44aa, 
            0x44cccc, 0xff7733, 0x9944ff, 0xff4488, 0x88ff44,
            0xffffff, 0x333333, 0x6688aa
        ];
        
        // Room group
        const room = new THREE.Group();
        
        // ==================== ROOM STRUCTURE ====================
        
        // Floor with terrazo look
        const floorGeo = new THREE.PlaneGeometry(12, 12);
        const floor = new THREE.Mesh(floorGeo, mats.floorTerrazo);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        room.add(floor);
        
        // Back wall
        const backWall = createBox(12, 8, 0.15, mats.wallBeige, 0, 4, -6);
        room.add(backWall);
        
        // Right wall
        const rightWall = createBox(0.15, 8, 12, mats.wallBeige, 6, 4, 0);
        room.add(rightWall);
        
        // ==================== DESK ====================
        
        const deskGroup = new THREE.Group();
        
        // Desktop surface
        const deskTop = createBox(4.5, 0.12, 2, mats.deskBlue, 0, 1.5, 0);
        deskGroup.add(deskTop);
        
        // Left panel (solid side)
        const deskLeftPanel = createBox(0.08, 1.5, 2, mats.deskBlue, -2.2, 0.75, 0);
        deskGroup.add(deskLeftPanel);
        
        // Right panel (solid side)
        const deskRightPanel = createBox(0.08, 1.5, 2, mats.deskBlue, 2.2, 0.75, 0);
        deskGroup.add(deskRightPanel);
        
        // Back panel
        const deskBackPanel = createBox(4.36, 1.5, 0.08, mats.deskBlue, 0, 0.75, -0.96);
        deskGroup.add(deskBackPanel);
        
        deskGroup.position.set(1.5, 0, -4);
        room.add(deskGroup);
        
        // ==================== MAIN MONITOR (Ultrawide Curved) ====================
        
        const mainMonitorGroup = new THREE.Group();
        
        // Monitor stand base
        const monitorStandBase = createBox(0.5, 0.04, 0.35, mats.monitorBlack, 0, 0.02, 0.3);
        mainMonitorGroup.add(monitorStandBase);
        
        // Monitor stand neck
        const monitorStandNeck = createBox(0.12, 0.6, 0.12, mats.monitorBlack, 0, 0.32, 0.15);
        mainMonitorGroup.add(monitorStandNeck);
        
        // Create curved monitor using segments
        const curveSegments = 7;
        const monitorWidth = 2.8;
        const monitorHeight = 0.85;
        const curveDepth = 0.3;
        
        for (let i = 0; i < curveSegments; i++) {
            const segWidth = monitorWidth / curveSegments;
            const angle = ((i / (curveSegments - 1)) - 0.5) * Math.PI * 0.3;
            const xPos = (i - (curveSegments - 1) / 2) * segWidth;
            const zPos = Math.cos(angle) * curveDepth - curveDepth;
            
            // Monitor frame segment
            const frameSeg = createBox(segWidth + 0.02, monitorHeight, 0.08, mats.monitorBlack, xPos, 0.95, zPos);
            frameSeg.rotation.y = -angle * 0.5;
            mainMonitorGroup.add(frameSeg);
            
            // Screen segment (purple/pink game display)
            const screenSeg = createBox(segWidth - 0.02, monitorHeight - 0.08, 0.01, mats.screenMain, xPos, 0.95, zPos + 0.045);
            screenSeg.rotation.y = -angle * 0.5;
            mainMonitorGroup.add(screenSeg);
        }
        
        // Game elements on screen - car shape
        const carBody = createBox(0.35, 0.12, 0.02, new THREE.MeshBasicMaterial({ color: 0xff00ff }), 0, 0.85, 0.12);
        mainMonitorGroup.add(carBody);
        
        // Neon lights effect on screen
        const neonLine1 = createBox(1.5, 0.02, 0.01, new THREE.MeshBasicMaterial({ color: 0xff0088 }), 0, 0.6, 0.12);
        const neonLine2 = createBox(1.2, 0.02, 0.01, new THREE.MeshBasicMaterial({ color: 0x8800ff }), 0.3, 0.7, 0.12);
        mainMonitorGroup.add(neonLine1, neonLine2);
        
        mainMonitorGroup.position.set(1.5, 1.56, -4.5);
        room.add(mainMonitorGroup);
        
        // ==================== SECONDARY MONITOR (Security Camera Feed) ====================
        
        const secMonitorGroup = new THREE.Group();
        
        // Monitor arm mount
        const mountPlate = createBox(0.15, 0.15, 0.05, mats.monitorBlack, 0, 0, -0.4);
        secMonitorGroup.add(mountPlate);
        
        const mountArm = createBox(0.06, 0.5, 0.06, mats.monitorBlack, 0, -0.25, -0.35);
        secMonitorGroup.add(mountArm);
        
        const mountArmHoriz = createBox(0.06, 0.06, 0.25, mats.monitorBlack, 0, -0.5, -0.2);
        secMonitorGroup.add(mountArmHoriz);
        
        // Monitor frame
        const secMonitorFrame = createBox(1.0, 0.65, 0.06, mats.monitorBlack, 0, 0, 0);
        secMonitorGroup.add(secMonitorFrame);
        
        // Screen with camera feed look
        const secScreen = createBox(0.92, 0.57, 0.01, mats.screenSecondary, 0, 0, 0.035);
        secMonitorGroup.add(secScreen);
        
        // Camera feed elements (bed/room view)
        const feedRect1 = createBox(0.3, 0.2, 0.005, new THREE.MeshBasicMaterial({ color: 0x445566 }), 0.1, 0.05, 0.04);
        const feedRect2 = createBox(0.2, 0.15, 0.005, new THREE.MeshBasicMaterial({ color: 0x556677 }), -0.2, -0.1, 0.04);
        secMonitorGroup.add(feedRect1, feedRect2);
        
        secMonitorGroup.position.set(0.7, 3.3, -4.6);
        room.add(secMonitorGroup);
        
        // ==================== PC CASE (Gaming with RGB) ====================
        
        const pcGroup = new THREE.Group();
        
        // Main case body
        const pcMain = createBox(0.45, 1.15, 0.95, mats.pcBlack, 0, 0.575, 0);
        pcGroup.add(pcMain);
        
        // Top panel with vents
        const pcTop = createBox(0.47, 0.03, 0.97, mats.pcBlack, 0, 1.165, 0);
        pcGroup.add(pcTop);
        
        // Front panel with mesh
        const pcFront = createBox(0.47, 1.1, 0.05, mats.pcBlack, 0, 0.57, 0.5);
        pcGroup.add(pcFront);
        
        // Glass side panel (left side, showing RGB)
        const pcGlass = createBox(0.02, 1.0, 0.8, mats.pcGlass, -0.235, 0.58, 0);
        pcGroup.add(pcGlass);
        
        // RGB Fans visible through glass - 3 rows of 2
        const rgbFans = [];
        const fanPositions = [
            { x: -0.22, y: 0.9, z: 0.22 },
            { x: -0.22, y: 0.9, z: -0.22 },
            { x: -0.22, y: 0.55, z: 0.22 },
            { x: -0.22, y: 0.55, z: -0.22 },
            { x: -0.22, y: 0.2, z: 0.22 },
            { x: -0.22, y: 0.2, z: -0.22 },
        ];
        
        fanPositions.forEach((pos, i) => {
            // Fan housing
            const fanHousing = new THREE.Mesh(
                new THREE.BoxGeometry(0.02, 0.22, 0.22),
                mats.pcBlack
            );
            fanHousing.position.set(pos.x, pos.y, pos.z);
            pcGroup.add(fanHousing);
            
            // RGB ring
            const rgbRing = new THREE.Mesh(
                new THREE.TorusGeometry(0.08, 0.015, 8, 20),
                new THREE.MeshBasicMaterial({ color: 0x00ffff })
            );
            rgbRing.position.set(pos.x - 0.01, pos.y, pos.z);
            rgbRing.rotation.y = Math.PI / 2;
            pcGroup.add(rgbRing);
            rgbFans.push(rgbRing);
            
            // Fan blades
            const fanBlade = new THREE.Mesh(
                new THREE.CircleGeometry(0.06, 6),
                new THREE.MeshBasicMaterial({ color: 0x1a1a2a, transparent: true, opacity: 0.5 })
            );
            fanBlade.position.set(pos.x - 0.015, pos.y, pos.z);
            fanBlade.rotation.y = Math.PI / 2;
            pcGroup.add(fanBlade);
        });
        
        // Internal RGB strip
        const rgbStrip = createBox(0.01, 0.8, 0.02, new THREE.MeshBasicMaterial({ color: 0xff00ff }), -0.15, 0.5, 0.35);
        pcGroup.add(rgbStrip);
        
        pcGroup.position.set(3.5, 1.56, -4.2);
        room.add(pcGroup);
        
        // ==================== KEYBOARD (Mechanical with RGB) ====================
        
        const keyboardGroup = new THREE.Group();
        
        // Base
        const kbBase = createBox(0.95, 0.045, 0.38, mats.keyboardBlack, 0, 0.0225, 0);
        keyboardGroup.add(kbBase);
        
        // Raised back
        const kbBack = createBox(0.95, 0.06, 0.1, mats.keyboardBlack, 0, 0.03, -0.14);
        keyboardGroup.add(kbBack);
        
        // Key rows
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 15; col++) {
                const keySize = col === 14 ? 0.08 : 0.05;
                const key = createBox(
                    keySize, 0.02, 0.05,
                    new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.6 }),
                    -0.4 + col * 0.058, 0.055, 0.12 - row * 0.07
                );
                keyboardGroup.add(key);
            }
        }
        
        // RGB underglow
        const kbGlow = createBox(0.9, 0.005, 0.35, new THREE.MeshBasicMaterial({ color: 0xff0066 }), 0, 0.002, 0);
        keyboardGroup.add(kbGlow);
        
        keyboardGroup.position.set(1.5, 1.56, -3.5);
        room.add(keyboardGroup);
        
        // ==================== MOUSE & MOUSEPAD ====================
        
        // Mousepad
        const mousepad = createBox(0.55, 0.02, 0.45, mats.mousepadGreen, 2.6, 1.57, -3.5);
        room.add(mousepad);
        
        // Mouse with ergonomic shape (using sphere + box combination)
        const mouseGroup = new THREE.Group();
        
        // Mouse body - elongated sphere
        const mouseBody = new THREE.Mesh(
            new THREE.SphereGeometry(0.06, 16, 12),
            mats.mouseBlack
        );
        mouseBody.scale.set(0.8, 0.5, 1.3);
        mouseBody.position.y = 0.035;
        mouseGroup.add(mouseBody);
        
        // Mouse top surface
        const mouseTop = new THREE.Mesh(
            new THREE.SphereGeometry(0.055, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
            mats.mouseBlack
        );
        mouseTop.scale.set(0.75, 0.6, 1.2);
        mouseTop.position.y = 0.03;
        mouseGroup.add(mouseTop);
        
        // Scroll wheel
        const scrollWheel = createCylinder(0.012, 0.012, 0.025, 12, 
            new THREE.MeshStandardMaterial({ color: 0x4a4a4a }), 0, 0.055, -0.02);
        scrollWheel.rotation.x = Math.PI / 2;
        mouseGroup.add(scrollWheel);
        
        // Left click button line
        const buttonLine = createBox(0.002, 0.002, 0.04, 
            new THREE.MeshStandardMaterial({ color: 0x0a0a0a }), 0, 0.058, -0.03);
        mouseGroup.add(buttonLine);
        
        mouseGroup.position.set(2.6, 1.58, -3.5);
        room.add(mouseGroup);
        
        // ==================== LAMP ====================
        
        const lampGroup = new THREE.Group();
        
        // Base
        const lampBase = createCylinder(0.12, 0.14, 0.04, 20, mats.lampMetal, 0, 0.02, 0);
        lampGroup.add(lampBase);
        
        // Lower arm
        const lampArm1 = createBox(0.035, 0.55, 0.035, mats.lampMetal, 0, 0.295, 0);
        lampGroup.add(lampArm1);
        
        // Joint
        const lampJoint1 = new THREE.Mesh(
            new THREE.SphereGeometry(0.04, 12, 12),
            mats.lampMetal
        );
        lampJoint1.position.set(0, 0.57, 0);
        lampGroup.add(lampJoint1);
        
        // Upper arm (angled)
        const lampArm2 = createBox(0.03, 0.45, 0.03, mats.lampMetal, 0.18, 0.72, 0);
        lampArm2.rotation.z = -Math.PI / 4;
        lampGroup.add(lampArm2);
        
        // Lamp head (cone)
        const lampHead = new THREE.Mesh(
            new THREE.ConeGeometry(0.12, 0.18, 16, 1, true),
            mats.lampMetal
        );
        lampHead.position.set(0.36, 0.82, 0);
        lampHead.rotation.z = Math.PI / 2 + 0.3;
        lampGroup.add(lampHead);
        
        // Light bulb glow
        const bulbGlow = new THREE.Mesh(
            new THREE.SphereGeometry(0.04, 12, 12),
            new THREE.MeshBasicMaterial({ color: 0xffffcc, transparent: true, opacity: 0.8 })
        );
        bulbGlow.position.set(0.38, 0.78, 0);
        lampGroup.add(bulbGlow);
        
        lampGroup.position.set(3.0, 1.56, -4.6);
        room.add(lampGroup);
        
        // ==================== BOOKSHELF ====================
        
        const shelfGroup = new THREE.Group();
        
        // Frame - back
        const shelfBack = createBox(1.1, 4.2, 0.08, mats.shelfBlack, 0, 2.1, -0.2);
        shelfGroup.add(shelfBack);
        
        // Frame - sides
        const shelfLeftSide = createBox(0.08, 4.2, 0.5, mats.shelfBlack, -0.51, 2.1, 0.05);
        const shelfRightSide = createBox(0.08, 4.2, 0.5, mats.shelfBlack, 0.51, 2.1, 0.05);
        shelfGroup.add(shelfLeftSide, shelfRightSide);
        
        // Shelves (5 levels)
        const shelfHeights = [0.05, 0.9, 1.75, 2.6, 3.45];
        shelfHeights.forEach(h => {
            const shelf = createBox(1.02, 0.06, 0.45, mats.shelfBlack, 0, h, 0.05);
            shelfGroup.add(shelf);
        });
        
        // Top shelf (closed box/speaker)
        const topBox = createBox(0.6, 0.55, 0.45, mats.shelfBlack, 0, 4.0, 0.05);
        shelfGroup.add(topBox);
        
        // Books on each shelf
        const shelfBookPositions = [
            { y: 0.08, count: 8 },
            { y: 0.93, count: 9 },
            { y: 1.78, count: 7 },
            { y: 2.63, count: 8 },
        ];
        
        shelfBookPositions.forEach(shelf => {
            let xPos = -0.42;
            for (let i = 0; i < shelf.count && xPos < 0.4; i++) {
                const bookWidth = 0.04 + Math.random() * 0.06;
                const bookHeight = 0.35 + Math.random() * 0.35;
                const bookDepth = 0.2 + Math.random() * 0.15;
                const bookColor = bookColors[Math.floor(Math.random() * bookColors.length)];
                
                const book = createBox(
                    bookWidth, bookHeight, bookDepth,
                    new THREE.MeshStandardMaterial({ color: bookColor, roughness: 0.7 }),
                    xPos + bookWidth / 2, shelf.y + bookHeight / 2, 0.1
                );
                
                // Slight random tilt
                book.rotation.z = (Math.random() - 0.5) * 0.08;
                shelfGroup.add(book);
                xPos += bookWidth + 0.015;
            }
        });
        
        // Some items on shelves (bottles, boxes)
        const bottleGeo = new THREE.CylinderGeometry(0.03, 0.035, 0.15, 8);
        const bottle = new THREE.Mesh(bottleGeo, new THREE.MeshStandardMaterial({ color: 0x334455 }));
        bottle.position.set(0.35, 2.7, 0.15);
        shelfGroup.add(bottle);
        
        // Small boxes
        const smallBox1 = createBox(0.15, 0.1, 0.12, new THREE.MeshStandardMaterial({ color: 0xddccbb }), -0.35, 3.5, 0.12);
        const smallBox2 = createBox(0.12, 0.08, 0.1, new THREE.MeshStandardMaterial({ color: 0xccbbaa }), 0.3, 3.52, 0.1);
        shelfGroup.add(smallBox1, smallBox2);
        
        shelfGroup.position.set(-2, 0, -5.2);
        room.add(shelfGroup);
        
        // ==================== GUITAR ====================
        
        const guitarGroup = new THREE.Group();
        
        // Body - main shape
        const bodyLower = new THREE.Mesh(
            new THREE.SphereGeometry(0.38, 20, 16),
            mats.guitarBody
        );
        bodyLower.scale.set(1, 0.22, 1.1);
        bodyLower.position.y = 0.4;
        guitarGroup.add(bodyLower);
        
        // Body - upper bout (smaller)
        const bodyUpper = new THREE.Mesh(
            new THREE.SphereGeometry(0.28, 16, 12),
            mats.guitarBody
        );
        bodyUpper.scale.set(1, 0.22, 1);
        bodyUpper.position.set(0, 0.75, 0);
        guitarGroup.add(bodyUpper);
        
        // Sound hole
        const soundHole = new THREE.Mesh(
            new THREE.RingGeometry(0.08, 0.12, 24),
            new THREE.MeshBasicMaterial({ color: 0x1a1008, side: THREE.DoubleSide })
        );
        soundHole.position.set(0, 0.5, 0.095);
        guitarGroup.add(soundHole);
        
        // Sound hole inner
        const soundHoleInner = new THREE.Mesh(
            new THREE.CircleGeometry(0.08, 24),
            new THREE.MeshBasicMaterial({ color: 0x0a0804 })
        );
        soundHoleInner.position.set(0, 0.5, 0.094);
        guitarGroup.add(soundHoleInner);
        
        // Bridge
        const bridge = createBox(0.25, 0.02, 0.04, mats.guitarNeck, 0, 0.28, 0.08);
        guitarGroup.add(bridge);
        
        // Neck
        const neck = createBox(0.065, 1.1, 0.025, mats.guitarNeck, 0, 1.45, 0);
        guitarGroup.add(neck);
        
        // Fretboard
        const fretboard = createBox(0.055, 1.0, 0.01, new THREE.MeshStandardMaterial({ color: 0x2a1a10 }), 0, 1.4, 0.018);
        guitarGroup.add(fretboard);
        
        // Frets
        for (let i = 0; i < 12; i++) {
            const fret = createBox(0.058, 0.008, 0.012, mats.guitarStrings, 0, 0.98 + i * 0.08, 0.02);
            guitarGroup.add(fret);
        }
        
        // Headstock
        const headstock = createBox(0.08, 0.28, 0.02, mats.guitarNeck, 0, 2.1, 0);
        guitarGroup.add(headstock);
        
        // Tuning pegs
        for (let i = 0; i < 3; i++) {
            const pegL = createCylinder(0.015, 0.015, 0.06, 8, mats.guitarStrings, -0.06, 2.0 + i * 0.08, 0);
            pegL.rotation.z = Math.PI / 2;
            guitarGroup.add(pegL);
            
            const pegR = createCylinder(0.015, 0.015, 0.06, 8, mats.guitarStrings, 0.06, 2.0 + i * 0.08, 0);
            pegR.rotation.z = Math.PI / 2;
            guitarGroup.add(pegR);
        }
        
        // Strings
        for (let i = 0; i < 6; i++) {
            const string = createBox(0.003, 1.7, 0.003, mats.guitarStrings, -0.02 + i * 0.008, 1.1, 0.03);
            guitarGroup.add(string);
        }
        
        guitarGroup.position.set(-3.5, 0, -3.5);
        guitarGroup.rotation.z = 0.12;
        guitarGroup.rotation.y = 0.2;
        room.add(guitarGroup);
        
        // ==================== FAN (Pedestal) ====================
        
        const fanGroup = new THREE.Group();
        
        // Base (circular, heavy)
        const fanBase = createCylinder(0.32, 0.35, 0.08, 20, mats.fanBlack, 0, 0.04, 0);
        fanGroup.add(fanBase);
        
        // Pole (telescopic look)
        const fanPoleLower = createCylinder(0.045, 0.05, 0.7, 12, mats.fanBlack, 0, 0.4, 0);
        fanGroup.add(fanPoleLower);
        
        const fanPoleUpper = createCylinder(0.035, 0.04, 0.5, 12, mats.fanBlack, 0, 1.0, 0);
        fanGroup.add(fanPoleUpper);
        
        // Motor housing
        const motorHousing = createCylinder(0.12, 0.12, 0.15, 16, mats.fanBlack, 0, 1.3, 0.1);
        motorHousing.rotation.x = Math.PI / 2;
        fanGroup.add(motorHousing);
        
        // Fan cage - front ring
        const cageFront = new THREE.Mesh(
            new THREE.TorusGeometry(0.35, 0.015, 8, 32),
            mats.fanBlack
        );
        cageFront.position.set(0, 1.3, 0.28);
        fanGroup.add(cageFront);
        
        // Fan cage - back ring
        const cageBack = new THREE.Mesh(
            new THREE.TorusGeometry(0.33, 0.012, 8, 32),
            mats.fanBlack
        );
        cageBack.position.set(0, 1.3, 0.05);
        fanGroup.add(cageBack);
        
        // Cage bars (radial)
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const bar = createBox(0.01, 0.01, 0.24, mats.fanBlack,
                Math.cos(angle) * 0.34, 1.3 + Math.sin(angle) * 0.34, 0.16);
            fanGroup.add(bar);
        }
        
        // Fan blades
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, side: THREE.DoubleSide });
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const blade = new THREE.Mesh(
                new THREE.PlaneGeometry(0.28, 0.08),
                bladeMat
            );
            blade.position.set(Math.cos(angle) * 0.14, 1.3 + Math.sin(angle) * 0.14, 0.18);
            blade.rotation.z = angle + Math.PI / 2;
            blade.rotation.x = 0.3;
            fanGroup.add(blade);
        }
        
        // Center cap
        const centerCap = createCylinder(0.05, 0.05, 0.04, 12, mats.fanBlack, 0, 1.3, 0.2);
        centerCap.rotation.x = Math.PI / 2;
        fanGroup.add(centerCap);
        
        fanGroup.position.set(-4.2, 0, -1.5);
        room.add(fanGroup);
        
        // ==================== CHAIR ====================
        
        const chairGroup = new THREE.Group();
        
        // Seat cushion
        const seatCushion = createBox(0.55, 0.12, 0.5, mats.chairGray, 0, 0.95, 0);
        chairGroup.add(seatCushion);
        
        // Seat frame
        const seatFrame = createBox(0.58, 0.04, 0.52, mats.chairMetal, 0, 0.87, 0);
        chairGroup.add(seatFrame);
        
        // Backrest
        const backrest = createBox(0.5, 0.65, 0.08, mats.chairGray, 0, 1.45, -0.22);
        backrest.rotation.x = 0.1;
        chairGroup.add(backrest);
        
        // Backrest frame
        const backFrame = createBox(0.54, 0.68, 0.04, mats.chairMetal, 0, 1.45, -0.25);
        backFrame.rotation.x = 0.1;
        chairGroup.add(backFrame);
        
        // Gas lift cylinder
        const gasLift = createCylinder(0.04, 0.05, 0.4, 12, mats.chairMetal, 0, 0.65, 0);
        chairGroup.add(gasLift);
        
        // Base hub
        const baseHub = createCylinder(0.08, 0.1, 0.1, 16, mats.chairMetal, 0, 0.4, 0);
        chairGroup.add(baseHub);
        
        // 5-star base with casters
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const legLength = 0.38;
            
            // Leg
            const leg = createBox(0.04, 0.035, legLength, mats.chairMetal, 
                Math.sin(angle) * legLength / 2, 0.35, Math.cos(angle) * legLength / 2);
            leg.rotation.y = -angle;
            chairGroup.add(leg);
            
            // Caster housing
            const casterHousing = createCylinder(0.03, 0.035, 0.05, 10, mats.chairMetal,
                Math.sin(angle) * legLength, 0.32, Math.cos(angle) * legLength);
            chairGroup.add(casterHousing);
            
            // Wheel
            const wheel = new THREE.Mesh(
                new THREE.TorusGeometry(0.035, 0.015, 8, 16),
                mats.chairMetal
            );
            wheel.position.set(Math.sin(angle) * legLength, 0.05, Math.cos(angle) * legLength);
            wheel.rotation.y = angle;
            chairGroup.add(wheel);
        }
        
        // Armrests (simple)
        const armrestL = createBox(0.06, 0.04, 0.25, mats.chairMetal, -0.28, 1.15, 0.05);
        const armrestR = createBox(0.06, 0.04, 0.25, mats.chairMetal, 0.28, 1.15, 0.05);
        chairGroup.add(armrestL, armrestR);
        
        // Armrest supports
        const armSupportL = createBox(0.03, 0.2, 0.03, mats.chairMetal, -0.28, 1.03, -0.05);
        const armSupportR = createBox(0.03, 0.2, 0.03, mats.chairMetal, 0.28, 1.03, -0.05);
        chairGroup.add(armSupportL, armSupportR);
        
        chairGroup.position.set(1.5, 0, -2.2);
        chairGroup.rotation.y = Math.PI + 0.2;
        room.add(chairGroup);
        
        // ==================== DUMBBELLS ====================
        
        const dumbbellsGroup = new THREE.Group();
        
        // Create rack of dumbbells (4 pairs, stacked)
        for (let row = 0; row < 2; row++) {
            for (let col = 0; col < 2; col++) {
                const db = new THREE.Group();
                
                // Bar
                const bar = createCylinder(0.018, 0.018, 0.36, 10, mats.weightBlack, 0, 0, 0);
                bar.rotation.z = Math.PI / 2;
                db.add(bar);
                
                // Left weight plates
                const plateL1 = createCylinder(0.065, 0.065, 0.04, 14, mats.weightRed, -0.14, 0, 0);
                plateL1.rotation.z = Math.PI / 2;
                db.add(plateL1);
                
                const plateL2 = createCylinder(0.055, 0.055, 0.03, 14, mats.weightBlack, -0.16, 0, 0);
                plateL2.rotation.z = Math.PI / 2;
                db.add(plateL2);
                
                // Right weight plates
                const plateR1 = createCylinder(0.065, 0.065, 0.04, 14, mats.weightRed, 0.14, 0, 0);
                plateR1.rotation.z = Math.PI / 2;
                db.add(plateR1);
                
                const plateR2 = createCylinder(0.055, 0.055, 0.03, 14, mats.weightBlack, 0.16, 0, 0);
                plateR2.rotation.z = Math.PI / 2;
                db.add(plateR2);
                
                db.position.set(col * 0.4 - 0.2, 0.08 + row * 0.16, row * 0.12);
                dumbbellsGroup.add(db);
            }
        }
        
        dumbbellsGroup.position.set(2.8, 0, -3.2);
        room.add(dumbbellsGroup);
        
        // ==================== OUTLET ON WALL ====================
        
        const outlet = createBox(0.1, 0.15, 0.02, new THREE.MeshStandardMaterial({ color: 0xf5f5f0 }), 3.5, 2.5, -5.9);
        room.add(outlet);
        
        // ==================== CABLE ON WALL ====================
        
        const cable = createBox(0.015, 1.2, 0.015, new THREE.MeshStandardMaterial({ color: 0x1a1a1a }), 2.8, 3.0, -5.9);
        room.add(cable);
        
        // ==================== ADD ROOM TO SCENE ====================
        
        scene.add(room);
        
        // ==================== LIGHTING ====================
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        mainLight.position.set(5, 12, 8);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -15;
        mainLight.shadow.camera.right = 15;
        mainLight.shadow.camera.top = 15;
        mainLight.shadow.camera.bottom = -15;
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);
        
        // Fill light
        const fillLight = new THREE.DirectionalLight(0xe6f0ff, 0.3);
        fillLight.position.set(-5, 8, 5);
        scene.add(fillLight);
        
        // PC RGB lights
        const pcRgbLight1 = new THREE.PointLight(0x00ffff, 0.6, 2.5);
        pcRgbLight1.position.set(3.2, 2.2, -4.2);
        scene.add(pcRgbLight1);
        
        const pcRgbLight2 = new THREE.PointLight(0xff00ff, 0.4, 2);
        pcRgbLight2.position.set(3.2, 1.8, -4.2);
        scene.add(pcRgbLight2);
        
        // Monitor glow
        const screenGlow = new THREE.PointLight(0x6600aa, 0.5, 2.5);
        screenGlow.position.set(1.5, 2.2, -4);
        scene.add(screenGlow);
        
        // Lamp light
        const lampLight = new THREE.PointLight(0xffffcc, 0.3, 1.5);
        lampLight.position.set(3.3, 2.4, -4.5);
        scene.add(lampLight);
        
        // ==================== THEME TOGGLE ====================
        
        let isNightMode = true;
        const themeToggle = document.getElementById('themeToggle');
        
        function setDayMode() {
            ambientLight.intensity = 0.7;
            mainLight.intensity = 1.3;
            fillLight.intensity = 0.5;
            pcRgbLight1.intensity = 0.2;
            pcRgbLight2.intensity = 0.15;
            screenGlow.intensity = 0.2;
            lampLight.intensity = 0.1;
            renderer.toneMappingExposure = 1.6;
            document.body.style.background = 'linear-gradient(135deg, #87CEEB 0%, #E0F6FF 100%)';
            themeToggle.textContent = '🌙 Modo Noche';
        }
        
        function setNightMode() {
            ambientLight.intensity = 0.35;
            mainLight.intensity = 0.9;
            fillLight.intensity = 0.3;
            pcRgbLight1.intensity = 0.6;
            pcRgbLight2.intensity = 0.4;
            screenGlow.intensity = 0.5;
            lampLight.intensity = 0.3;
            renderer.toneMappingExposure = 1.2;
            document.body.style.background = 'linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%)';
            themeToggle.textContent = '☀️ Modo Día';
        }
        
        themeToggle.addEventListener('click', () => {
            isNightMode = !isNightMode;
            isNightMode ? setNightMode() : setDayMode();
        });
        
        // ==================== ANIMATION ====================
        
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.025;
            
            // Animate RGB fans
            rgbFans.forEach((fan, i) => {
                const hue = (time * 0.4 + i * 0.15) % 1;
                fan.material.color.setHSL(hue, 1, 0.55);
            });
            
            // Animate RGB strip in PC
            rgbStrip.material.color.setHSL((time * 0.3 + 0.5) % 1, 1, 0.5);
            
            // Animate PC lights
            pcRgbLight1.color.setHSL((time * 0.25) % 1, 1, 0.5);
            pcRgbLight2.color.setHSL((time * 0.25 + 0.5) % 1, 1, 0.5);
            
            // Keyboard underglow
            kbGlow.material.color.setHSL((time * 0.15) % 1, 1, 0.5);
            
            // Subtle screen flicker
            screenGlow.intensity = 0.45 + Math.sin(time * 2) * 0.08;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // ==================== RESIZE HANDLER ====================
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 1200);
        
        animate();
    </script>
</body>
</html>
