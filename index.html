<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Room in 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas {
            display: block;
        }
        
        .ui-overlay {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }
        
        .title {
            top: 30px;
            left: 40px;
            color: #fff;
        }
        
        .title h1 {
            font-family: 'Space Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #00d9ff, #ff00e5, #00d9ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease infinite;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
        }
        
        .title p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
            font-weight: 300;
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }
        
        .controls-hint {
            bottom: 30px;
            left: 40px;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }
        
        .controls-hint span {
            display: block;
            margin-bottom: 5px;
            font-family: 'Space Mono', monospace;
        }
        
        .controls-hint span::before {
            content: '→';
            margin-right: 10px;
            color: #00d9ff;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        .loading.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-text {
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            color: #00d9ff;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loading-bar::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #ff00e5);
            animation: loading-slide 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes loading-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 100;
            pointer-events: auto;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .theme-toggle:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-text">Cargando habitación...</div>
        <div class="loading-bar"></div>
    </div>
    
    <div class="ui-overlay title">
        <h1>My Room in 3D</h1>
        <p>AMC's Workspace</p>
    </div>
    
    <div class="ui-overlay controls-hint">
        <span>Arrastra para rotar</span>
        <span>Scroll para zoom</span>
        <span>Click derecho para mover</span>
    </div>
    
    <button class="theme-toggle" id="themeToggle">☀️ Modo Día</button>
    
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI / 1.8;
        
        camera.position.set(10, 8, 10);
        controls.target.set(0, 2, 0);
        
        // Helper functions
        function createBox(w, h, d, material, x, y, z) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }
        
        function createCylinder(rTop, rBot, h, segments, material, x, y, z) {
            const geometry = new THREE.CylinderGeometry(rTop, rBot, h, segments);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }
        
        // Materials with better colors matching the photo
        const mats = {
            // Room
            wallBeige: new THREE.MeshStandardMaterial({ color: 0xd4c8b8, roughness: 0.95, metalness: 0 }),
            floorTerrazo: new THREE.MeshStandardMaterial({ color: 0x9a9080, roughness: 0.6, metalness: 0.1 }),
            
            // Desk - blue/teal color
            deskBlue: new THREE.MeshStandardMaterial({ color: 0x5b9aa9, roughness: 0.4, metalness: 0.1 }),
            
            // Monitors
            monitorBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.7 }),
            screenMain: new THREE.MeshBasicMaterial({ color: 0x1a0a2a }),
            screenSecondary: new THREE.MeshBasicMaterial({ color: 0x2a3a4a }),
            
            // PC Case
            pcBlack: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.4, metalness: 0.6 }),
            pcGlass: new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2a, roughness: 0.1, metalness: 0.3, 
                transparent: true, opacity: 0.6 
            }),
            
            // Shelf
            shelfBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.1 }),
            
            // Chair
            chairGray: new THREE.MeshStandardMaterial({ color: 0x6a6a70, roughness: 0.8, metalness: 0 }),
            chairMetal: new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.4, metalness: 0.6 }),
            
            // Guitar
            guitarBody: new THREE.MeshStandardMaterial({ color: 0xc4a060, roughness: 0.35, metalness: 0.1 }),
            guitarNeck: new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.5, metalness: 0 }),
            guitarStrings: new THREE.MeshStandardMaterial({ color: 0xccccaa, roughness: 0.3, metalness: 0.8 }),
            
            // Fan
            fanBlack: new THREE.MeshStandardMaterial({ color: 0x202020, roughness: 0.5, metalness: 0.3 }),
            
            // Peripherals
            keyboardBlack: new THREE.MeshStandardMaterial({ color: 0x252525, roughness: 0.5, metalness: 0.2 }),
            mouseBlack: new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.3 }),
            mousepadGreen: new THREE.MeshStandardMaterial({ color: 0x5a7a3a, roughness: 0.9, metalness: 0 }),
            
            // Lamp
            lampMetal: new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.3, metalness: 0.8 }),
            
            // Weights
            weightBlack: new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6, metalness: 0.4 }),
            weightRed: new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.5, metalness: 0.2 }),
        };
        
        // Book colors from the photo
        const bookColors = [
            0xcc4444, 0x44aa44, 0x4466cc, 0xeecc44, 0xcc44aa, 
            0x44cccc, 0xff7733, 0x9944ff, 0xff4488, 0x88ff44,
            0xffffff, 0x333333, 0x6688aa
        ];
        
        // Room group
        const room = new THREE.Group();
        
        // ==================== ROOM STRUCTURE ====================

        // Floor: procedural terrazzo (dense multi-colour chips on a cream base, like the photo)
        function createTerrazzoTexture() {
            const size = 2048; // one tile covers 4 x 4 units (2 x 2 m)
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Draw at every wrapped offset so the tile repeats without seams
            const wrapDraw = (x, y, extent, draw) => {
                for (const ox of [-size, 0, size]) {
                    for (const oy of [-size, 0, size]) {
                        const px = x + ox, py = y + oy;
                        if (px + extent < 0 || px - extent > size || py + extent < 0 || py - extent > size) continue;
                        draw(px, py);
                    }
                }
            };

            // Cream base with faint mottling
            ctx.fillStyle = '#dccfb6';
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 400; i++) {
                const x = Math.random() * size, y = Math.random() * size, r = 40 + Math.random() * 140;
                const tone = Math.random() < 0.5 ? '255,250,240' : '150,135,115';
                wrapDraw(x, y, r, (px, py) => {
                    const g = ctx.createRadialGradient(px, py, 0, px, py, r);
                    g.addColorStop(0, `rgba(${tone},0.06)`);
                    g.addColorStop(1, `rgba(${tone},0)`);
                    ctx.fillStyle = g;
                    ctx.fillRect(px - r, py - r, r * 2, r * 2);
                });
            }

            // Aggregate chips: charcoal, brown, tan, grey and white marble
            const palette = [
                { c: ['#1f1b19', '#2b2623', '#3a3431'], w: 34 },
                { c: ['#5a4636', '#6e5642', '#4a392c'], w: 25 },
                { c: ['#a58f72', '#b8a384', '#947f64'], w: 20 },
                { c: ['#7d7872', '#8e8a83', '#6b6762'], w: 15 },
                { c: ['#f1ece2', '#e8e1d3', '#fbf8f1'], w: 10 },
            ];
            const totalWeight = palette.reduce((s, p) => s + p.w, 0);
            const pickColour = () => {
                let r = Math.random() * totalWeight;
                for (const p of palette) {
                    if ((r -= p.w) < 0) return p.c[Math.floor(Math.random() * p.c.length)];
                }
                return palette[0].c[0];
            };

            for (let i = 0; i < 11000; i++) {
                const big = Math.random() < 0.02;
                const radius = big ? 10 + Math.random() * 10 : 2.2 + Math.pow(Math.random(), 2.0) * 9;
                const sides = 5 + Math.floor(Math.random() * 4);
                const rot = Math.random() * Math.PI * 2;
                const verts = [];
                for (let s = 0; s < sides; s++) {
                    const a = rot + (s / sides) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
                    const rr = radius * (0.65 + Math.random() * 0.35);
                    verts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.8]);
                }
                const colour = pickColour();
                wrapDraw(Math.random() * size, Math.random() * size, radius, (px, py) => {
                    ctx.fillStyle = colour;
                    ctx.beginPath();
                    verts.forEach((v, k) => k ? ctx.lineTo(px + v[0], py + v[1]) : ctx.moveTo(px + v[0], py + v[1]));
                    ctx.closePath();
                    ctx.fill();
                });
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(3, 3); // 12 units / 4 units per tile
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        const floorGroup = new THREE.Group();
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 12),
            new THREE.MeshStandardMaterial({
                map: createTerrazzoTexture(),
                roughness: 0.42,
                metalness: 0.04
            })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        floorGroup.add(floor);

        room.add(floorGroup);

        // ==================== WALLS WITH ACOUSTIC PANEL TEXTURE ====================

        // Back wall base
        const backWall = createBox(12, 8, 0.15, mats.wallBeige, 0, 4, -6);
        room.add(backWall);

        // Right wall base
        const rightWall = createBox(0.15, 8, 12, mats.wallBeige, 6, 4, 0);
        room.add(rightWall);

        // Acoustic panel texture on back wall (grid pattern like in photo)
        const panelMat = new THREE.MeshStandardMaterial({
            color: 0xd8cfc0,
            roughness: 0.95,
            metalness: 0
        });

        const panelMatDark = new THREE.MeshStandardMaterial({
            color: 0xc8bfb0,
            roughness: 0.95,
            metalness: 0
        });

        // Create acoustic panel grid on back wall
        const panelWidth = 0.8;
        const panelHeight = 0.8;
        const panelGap = 0.02;

        for (let py = 0; py < 8; py++) {
            for (let px = 0; px < 12; px++) {
                // Alternate panel shades slightly for texture
                const mat = (px + py) % 3 === 0 ? panelMatDark : panelMat;

                const panel = createBox(panelWidth - panelGap, panelHeight - panelGap, 0.02, mat,
                    -5.2 + px * panelWidth + panelWidth/2,
                    0.4 + py * panelHeight + panelHeight/2,
                    -5.9);
                room.add(panel);

                // Panel edge groove (subtle)
                if (py > 0) {
                    const grooveH = createBox(panelWidth - panelGap, 0.008, 0.01,
                        new THREE.MeshStandardMaterial({ color: 0xb0a090, roughness: 0.8 }),
                        -5.2 + px * panelWidth + panelWidth/2,
                        0.4 + py * panelHeight,
                        -5.88);
                    room.add(grooveH);
                }
                if (px > 0) {
                    const grooveV = createBox(0.008, panelHeight - panelGap, 0.01,
                        new THREE.MeshStandardMaterial({ color: 0xb0a090, roughness: 0.8 }),
                        -5.2 + px * panelWidth,
                        0.4 + py * panelHeight + panelHeight/2,
                        -5.88);
                    room.add(grooveV);
                }
            }
        }

        // Create acoustic panel grid on right wall
        for (let py = 0; py < 8; py++) {
            for (let pz = 0; pz < 12; pz++) {
                const mat = (pz + py) % 3 === 0 ? panelMatDark : panelMat;

                const panel = createBox(0.02, panelHeight - panelGap, panelWidth - panelGap, mat,
                    5.9,
                    0.4 + py * panelHeight + panelHeight/2,
                    -5.2 + pz * panelWidth + panelWidth/2);
                room.add(panel);
            }
        }

        // Wall power outlet (visible in photo)
        const outletPlate = createBox(0.08, 0.12, 0.015, new THREE.MeshStandardMaterial({
            color: 0xf0ebe5, roughness: 0.5
        }), 2.8, 2.8, -5.88);
        room.add(outletPlate);

        // Outlet holes
        const outletHole1 = createBox(0.015, 0.025, 0.01, new THREE.MeshBasicMaterial({ color: 0x2a2a2a }), 2.78, 2.82, -5.87);
        const outletHole2 = createBox(0.015, 0.025, 0.01, new THREE.MeshBasicMaterial({ color: 0x2a2a2a }), 2.82, 2.82, -5.87);
        room.add(outletHole1, outletHole2);

        // Cable running down from outlet (visible in photo)
        const cable = createCylinder(0.008, 0.008, 1.5, 8, new THREE.MeshStandardMaterial({
            color: 0x1a1a1a, roughness: 0.6
        }), 2.8, 2.0, -5.87);
        room.add(cable);
        
        // ==================== DESK ====================
        
        const deskGroup = new THREE.Group();
        
        // Desktop surface
        const deskTop = createBox(4.5, 0.12, 2, mats.deskBlue, 0, 1.5, 0);
        deskGroup.add(deskTop);
        
        // Left panel (solid side)
        const deskLeftPanel = createBox(0.08, 1.5, 2, mats.deskBlue, -2.2, 0.75, 0);
        deskGroup.add(deskLeftPanel);
        
        // Right panel (solid side)
        const deskRightPanel = createBox(0.08, 1.5, 2, mats.deskBlue, 2.2, 0.75, 0);
        deskGroup.add(deskRightPanel);
        
        // Back panel
        const deskBackPanel = createBox(4.36, 1.5, 0.08, mats.deskBlue, 0, 0.75, -0.96);
        deskGroup.add(deskBackPanel);
        
        deskGroup.position.set(1.5, 0, -4);
        room.add(deskGroup);
        
        // ==================== MAIN MONITOR (Ultrawide Curved) ====================

        const mainMonitorGroup = new THREE.Group();

        // Monitor stand base (V-shaped like in photo)
        const standBaseLeft = createBox(0.35, 0.025, 0.06, mats.monitorBlack, -0.15, 0.012, 0.35);
        standBaseLeft.rotation.y = -0.4;
        mainMonitorGroup.add(standBaseLeft);

        const standBaseRight = createBox(0.35, 0.025, 0.06, mats.monitorBlack, 0.15, 0.012, 0.35);
        standBaseRight.rotation.y = 0.4;
        mainMonitorGroup.add(standBaseRight);

        // Monitor stand neck
        const monitorStandNeck = createBox(0.08, 0.5, 0.08, mats.monitorBlack, 0, 0.28, 0.2);
        mainMonitorGroup.add(monitorStandNeck);

        // Stand to monitor joint
        const standJoint = createBox(0.12, 0.08, 0.15, mats.monitorBlack, 0, 0.53, 0.08);
        mainMonitorGroup.add(standJoint);

        // Create curved monitor using more segments for smoother curve
        const curveSegments = 12;
        const monitorWidth = 2.6;
        const monitorHeight = 0.75;
        const curveDepth = 0.35;

        for (let i = 0; i < curveSegments; i++) {
            const segWidth = monitorWidth / curveSegments;
            const angle = ((i / (curveSegments - 1)) - 0.5) * Math.PI * 0.35;
            const xPos = (i - (curveSegments - 1) / 2) * segWidth;
            const zPos = Math.cos(angle) * curveDepth - curveDepth;

            // Monitor frame segment
            const frameSeg = createBox(segWidth + 0.015, monitorHeight, 0.06, mats.monitorBlack, xPos, 0.95, zPos);
            frameSeg.rotation.y = -angle * 0.6;
            mainMonitorGroup.add(frameSeg);

            // Screen segment with gradient effect (dark purple base)
            const screenColor = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.75 + i * 0.015, 0.5, 0.08)
            });
            const screenSeg = createBox(segWidth - 0.01, monitorHeight - 0.06, 0.01, screenColor, xPos, 0.95, zPos + 0.035);
            screenSeg.rotation.y = -angle * 0.6;
            mainMonitorGroup.add(screenSeg);
        }

        // Game scene elements - cyberpunk city/road with car
        // Road/ground with perspective lines
        const roadBase = createBox(2.0, 0.25, 0.01, new THREE.MeshBasicMaterial({ color: 0x150820 }), 0, 0.65, 0.08);
        mainMonitorGroup.add(roadBase);

        // Neon road lines (purple/pink)
        const roadLine1 = createBox(0.8, 0.015, 0.01, new THREE.MeshBasicMaterial({ color: 0xff00aa }), -0.4, 0.58, 0.085);
        const roadLine2 = createBox(0.9, 0.015, 0.01, new THREE.MeshBasicMaterial({ color: 0xff0088 }), 0.3, 0.62, 0.085);
        const roadLine3 = createBox(1.2, 0.012, 0.01, new THREE.MeshBasicMaterial({ color: 0xaa0066 }), 0, 0.68, 0.085);
        mainMonitorGroup.add(roadLine1, roadLine2, roadLine3);

        // City skyline silhouette
        for (let i = 0; i < 8; i++) {
            const buildingHeight = 0.08 + Math.random() * 0.18;
            const building = createBox(0.15 + Math.random() * 0.1, buildingHeight, 0.01,
                new THREE.MeshBasicMaterial({ color: 0x0a0515 }),
                -0.9 + i * 0.25, 0.95 + buildingHeight/2, 0.08);
            mainMonitorGroup.add(building);

            // Building window lights
            if (Math.random() > 0.4) {
                const windowLight = createBox(0.02, 0.015, 0.005,
                    new THREE.MeshBasicMaterial({ color: 0xff66aa }),
                    -0.88 + i * 0.25, 0.95 + buildingHeight * 0.4, 0.09);
                mainMonitorGroup.add(windowLight);
            }
        }

        // Car silhouette (centered, pink/magenta glow)
        const carBody = createBox(0.28, 0.08, 0.015, new THREE.MeshBasicMaterial({ color: 0x220033 }), 0, 0.72, 0.09);
        mainMonitorGroup.add(carBody);

        // Car roof
        const carRoof = createBox(0.15, 0.05, 0.015, new THREE.MeshBasicMaterial({ color: 0x1a0025 }), 0, 0.78, 0.09);
        mainMonitorGroup.add(carRoof);

        // Car headlights/taillights glow
        const carGlowLeft = createBox(0.025, 0.02, 0.01, new THREE.MeshBasicMaterial({ color: 0xff0066 }), -0.15, 0.71, 0.095);
        const carGlowRight = createBox(0.025, 0.02, 0.01, new THREE.MeshBasicMaterial({ color: 0xff0066 }), 0.15, 0.71, 0.095);
        mainMonitorGroup.add(carGlowLeft, carGlowRight);

        // Neon reflections/ambient light streaks
        const neonStreak1 = createBox(0.6, 0.08, 0.01, new THREE.MeshBasicMaterial({
            color: 0xcc00ff, transparent: true, opacity: 0.6
        }), -0.5, 1.1, 0.082);
        const neonStreak2 = createBox(0.5, 0.06, 0.01, new THREE.MeshBasicMaterial({
            color: 0xff00cc, transparent: true, opacity: 0.5
        }), 0.4, 1.05, 0.082);
        const neonStreak3 = createBox(0.4, 0.1, 0.01, new THREE.MeshBasicMaterial({
            color: 0x8800ff, transparent: true, opacity: 0.4
        }), 0.7, 0.95, 0.082);
        mainMonitorGroup.add(neonStreak1, neonStreak2, neonStreak3);

        // Monitor bezel bottom (thicker like in photo)
        const bezelBottom = createBox(2.5, 0.04, 0.07, mats.monitorBlack, 0, 0.54, 0);
        mainMonitorGroup.add(bezelBottom);

        mainMonitorGroup.position.set(1.5, 1.56, -4.5);
        room.add(mainMonitorGroup);
        
        // ==================== SECONDARY MONITOR (Security Camera Feed - positioned above left of main) ====================

        const secMonitorGroup = new THREE.Group();

        // Wall mount plate
        const mountPlate = createBox(0.08, 0.08, 0.03, mats.monitorBlack, 0, 0, -0.55);
        secMonitorGroup.add(mountPlate);

        // Monitor arm - vertical part from wall
        const mountArmVert = createBox(0.04, 0.04, 0.35, mats.monitorBlack, 0, 0, -0.35);

        // Cylinder running between two points (strings, stand tubes)
        function tubeBetween(a, b, radius, material, segments = 6) {
            const dir = new THREE.Vector3().subVectors(b, a);
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dir.length(), segments), material);
            mesh.position.copy(a).add(b).multiplyScalar(0.5);

        // The instrument itself sits on the stand cradle and leans back against the wall
        const gtInstrument = new THREE.Group();

        const gtOutline = new THREE.Shape();

        const gtSoundHole = new THREE.Mesh(new THREE.CircleGeometry(0.10, 48), new THREE.MeshBasicMaterial({ color: 0x050302 }));

        const gtHalfWidthAt = y => 0.043 + (0.062 - 0.043) * ((gtNutY - y) / (gtNutY - gtBoardEndY));

        const gtNeckShape = new THREE.Shape();
        gtNeckShape.moveTo(-0.047, gtNutY);

        const gtNeck = new THREE.Mesh(new THREE.ExtrudeGeometry(gtNeckShape, { depth: 0.07, bevelEnabled: false }), gtNeckWood);

        gtBoardShape.moveTo(-0.043, gtNutY);

        gtHeadstock.rotation.x = -0.2;
        gtInstrument.add(gtHeadstock);

        // ----- Strings: saddle -> nut, resting just above the fret tops -----
        const gtStringRadii = [0.0030, 0.0026, 0.0022, 0.0018, 0.0015, 0.0012];
        for (let i = 0; i < 6; i++) {
            const a = new THREE.Vector3(-0.055 + i * 0.022, 0.185, 0.137);

            const s = tubeBetween(a, b, gtStringRadii[i], gtStringMat, 5);

        [-1, 1].forEach(side => {

        guitarGroup.add(tubeBetween(new THREE.Vector3(0, 0.03, 0), new THREE.Vector3(0, 0.30, -0.03), 0.016, gtStandMat, 8));
        guitarGroup.add(createBox(0.40, 0.03, 0.07, gtStandMat, 0, 0.30, 0.0));
        [-1, 1].forEach(side => guitarGroup.add(createBox(0.03, 0.12, 0.07, gtStandMat, side * 0.17, 0.35, 0.0)));
        // Rear upright up to the neck, with a small V-yoke
        guitarGroup.add(tubeBetween(new THREE.Vector3(0, 0.03, -0.42), new THREE.Vector3(0, 1.70, -0.26), 0.012, gtStandMat, 8));
        [-1, 1].forEach(side => guitarGroup.add(tubeBetween(
            new THREE.Vector3(0, 1.70, -0.26), new THREE.Vector3(side * 0.07, 1.75, -0.19), 0.01, gtStandMat, 6)));

        guitarGroup.position.set(-3.4, 0, -5.35);
        guitarGroup.rotation.y = 0.45;
        room.add(guitarGroup);
        
        // ==================== FAN (16" pedestal fan, black) ====================
        // Real scale (1 unit = 0.5 m). The head faces +z locally.

        const fanGroup = new THREE.Group();

        const fanBlackMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.55, metalness: 0.15, side: THREE.DoubleSide });
        const fanGrayMat  = new THREE.MeshStandardMaterial({ color: 0x2c2c2e, roughness: 0.5, metalness: 0.2 });
        const fanWireMat  = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.4, metalness: 0.5 });
        const fanBladeMat = new THREE.MeshStandardMaterial({ color: 0x151517, roughness: 0.5, metalness: 0.1 });

        // Round base (turned profile)
        const fanBaseProfile = [
            [0.00, 0.00], [0.44, 0.00], [0.46, 0.02], [0.45, 0.05], [0.38, 0.07],

        fanBase.receiveShadow = true;

        // Telescopic pole with a grey height-lock collar
        fanGroup.add(createCylinder(0.035, 0.038, 0.84, 16, fanBlackMat, 0, 0.58, 0));
        fanGroup.add(createCylinder(0.052, 0.052, 0.09, 16, fanGrayMat, 0, 1.0, 0));
        fanGroup.add(createCylinder(0.028, 0.028, 0.70, 16, fanBlackMat, 0, 1.30, 0));

        // Head: pivots on top of the pole, shifted so the motor sits right above it
        const fanHead = new THREE.Group();
        fanHead.position.set(0, 1.75, 0.12);
        fanHead.rotation.x = -0.08; // tilted up slightly
        fanGroup.add(fanHead);

        // Motor housing, rear cap, yoke and knobs
        const fanMotor = createCylinder(0.125, 0.125, 0.2, 28, fanBlackMat, 0, 0, -0.12);
        fanMotor.rotation.x = Math.PI / 2;
        fanHead.add(fanMotor);
        const fanMotorCap = new THREE.Mesh(new THREE.SphereGeometry(0.125, 28, 16), fanBlackMat);
        fanMotorCap.scale.set(1, 1, 0.75);
        fanMotorCap.position.set(0, 0, -0.22);
        fanMotorCap.castShadow = true;
        fanHead.add(fanMotorCap);
        fanHead.add(createBox(0.09, 0.12, 0.1, fanGrayMat, 0, -0.15, -0.12));
        const fanTiltKnob = createCylinder(0.03, 0.03, 0.05, 14, fanGrayMat, 0.11, -0.14, -0.12);
        fanTiltKnob.rotation.z = Math.PI / 2;
        fanHead.add(fanTiltKnob);
        fanHead.add(createCylinder(0.018, 0.018, 0.06, 12, fanGrayMat, 0, 0.15, -0.12));

        // Guard: shallow domes in front and behind the blades, joined by a rim ring
        const fanGuardR = 0.40;
        const fanFrontZ = r => 0.02 + 0.15 * Math.pow(1 - Math.pow(r / fanGuardR, 2), 0.8);
        const fanRearZ  = r => 0.02 - 0.17 * Math.pow(1 - Math.pow(r / fanGuardR, 2), 0.8);

        function fanGuardSpokes(zOf, innerR, count) {
            for (let i = 0; i < count; i++) {
                const a = (i / count) * Math.PI * 2;
                const pts = [];
                for (let k = 0; k <= 8; k++) {
                    const r = innerR + (fanGuardR - innerR) * (k / 8);
                    pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, zOf(r)));

                const spoke = new THREE.Mesh(
                    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.0035, 4, false), fanWireMat);
                spoke.castShadow = true;
                fanHead.add(spoke);
            }

        function fanGuardRings(zOf, radii) {
            radii.forEach(r => {

                ring.position.z = zOf(r);
                ring.castShadow = true;
                fanHead.add(ring);
            });
        }
        fanGuardSpokes(fanFrontZ, 0.07, 28);
        fanGuardRings(fanFrontZ, [0.09, 0.17, 0.25, 0.32, 0.37]);
        fanGuardSpokes(fanRearZ, 0.13, 20);
        fanGuardRings(fanRearZ, [0.17, 0.25, 0.32, 0.37]);

        // ==================== CHAIR (Simple office chair like in photo) ====================

        const chairGroup = new THREE.Group();

        const backShell = createBox(0.46, 0.54, 0.025, new THREE.MeshStandardMaterial({

        const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.1 });

        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;

        // No armrests (matches photo - simple office chair without arms)

        chairGroup.position.set(1.5, 0, -2.2);
        chairGroup.rotation.y = Math.PI + 0.15;
        room.add(chairGroup);
        
        // ==================== DUMBBELLS (Rack with adjustable weights like in photo) ====================

        const dumbbellsGroup = new THREE.Group();

        // Dumbbell rack base (simple A-frame style)
        const rackBaseMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a, roughness: 0.6, metalness: 0.3
        });

        // Rack uprights
        const rackLeft = createBox(0.04, 0.25, 0.04, rackBaseMat, -0.25, 0.125, 0);
        const rackRight = createBox(0.04, 0.25, 0.04, rackBaseMat, 0.25, 0.125, 0);
        dumbbellsGroup.add(rackLeft, rackRight);

        // Rack crossbars
        const rackBar1 = createBox(0.54, 0.03, 0.04, rackBaseMat, 0, 0.08, 0);
        const rackBar2 = createBox(0.54, 0.03, 0.04, rackBaseMat, 0, 0.2, 0);
        dumbbellsGroup.add(rackBar1, rackBar2);

        // Create adjustable dumbbells (2 rows)
        const weightSizes = [
            { outer: 0.07, inner: 0.055, redOuter: 0.065, y: 0.085 },
            { outer: 0.065, inner: 0.05, redOuter: 0.06, y: 0.21 },
        ];

        weightSizes.forEach((size, row) => {
            for (let col = 0; col < 2; col++) {
                const db = new THREE.Group();

                // Grip (rubberized handle)
                const grip = createCylinder(0.02, 0.02, 0.12, 12, new THREE.MeshStandardMaterial({
                    color: 0x2a2a2a, roughness: 0.7
                }), 0, 0, 0);
                grip.rotation.z = Math.PI / 2;
                db.add(grip);

                // Handle knurling texture (simple rings)
                for (let k = 0; k < 5; k++) {
                    const knurl = new THREE.Mesh(
                        new THREE.TorusGeometry(0.022, 0.002, 6, 12),
                        new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
                    );
                    knurl.position.set(-0.04 + k * 0.02, 0, 0);
                    knurl.rotation.y = Math.PI / 2;
                    db.add(knurl);
                }

                // Left weight assembly
                // Inner black plate
                const plateL1 = createCylinder(size.inner, size.inner, 0.025, 14, mats.weightBlack, -0.08, 0, 0);
                plateL1.rotation.z = Math.PI / 2;
                db.add(plateL1);

                // Red outer plate
                const plateL2 = createCylinder(size.redOuter, size.redOuter, 0.035, 14, mats.weightRed, -0.115, 0, 0);
                plateL2.rotation.z = Math.PI / 2;
                db.add(plateL2);

                // Outer black plate
                const plateL3 = createCylinder(size.outer, size.outer, 0.03, 14, mats.weightBlack, -0.15, 0, 0);
                plateL3.rotation.z = Math.PI / 2;
                db.add(plateL3);

                // End cap
                const capL = createCylinder(0.025, 0.025, 0.02, 10, new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a, roughness: 0.4
                }), -0.17, 0, 0);
                capL.rotation.z = Math.PI / 2;
                db.add(capL);

                // Right weight assembly (mirror)
                const plateR1 = createCylinder(size.inner, size.inner, 0.025, 14, mats.weightBlack, 0.08, 0, 0);
                plateR1.rotation.z = Math.PI / 2;
                db.add(plateR1);

                const plateR2 = createCylinder(size.redOuter, size.redOuter, 0.035, 14, mats.weightRed, 0.115, 0, 0);
                plateR2.rotation.z = Math.PI / 2;
                db.add(plateR2);

                const plateR3 = createCylinder(size.outer, size.outer, 0.03, 14, mats.weightBlack, 0.15, 0, 0);
                plateR3.rotation.z = Math.PI / 2;
                db.add(plateR3);

                const capR = createCylinder(0.025, 0.025, 0.02, 10, new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a, roughness: 0.4
                }), 0.17, 0, 0);
                capR.rotation.z = Math.PI / 2;
                db.add(capR);

                db.position.set(col * 0.38 - 0.19, size.y, 0);
                dumbbellsGroup.add(db);
            }
        });

        dumbbellsGroup.position.set(3.0, 0, -3.0);
        dumbbellsGroup.rotation.y = -0.2;
        room.add(dumbbellsGroup);
        
        // ==================== ADD ROOM TO SCENE ====================
        
        scene.add(room);
        
        // ==================== LIGHTING ====================
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        mainLight.position.set(5, 12, 8);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -15;
        mainLight.shadow.camera.right = 15;
        mainLight.shadow.camera.top = 15;
        mainLight.shadow.camera.bottom = -15;
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);
        
        // Fill light
        const fillLight = new THREE.DirectionalLight(0xe6f0ff, 0.3);
        fillLight.position.set(-5, 8, 5);
        scene.add(fillLight);
        
        // PC RGB lights
        const pcRgbLight1 = new THREE.PointLight(0x00ffff, 0.6, 2.5);
        pcRgbLight1.position.set(3.2, 2.2, -4.2);
        scene.add(pcRgbLight1);
        
        const pcRgbLight2 = new THREE.PointLight(0xff00ff, 0.4, 2);
        pcRgbLight2.position.set(3.2, 1.8, -4.2);
        scene.add(pcRgbLight2);
        
        // Monitor glow
        const screenGlow = new THREE.PointLight(0x6600aa, 0.5, 2.5);
        screenGlow.position.set(1.5, 2.2, -4);
        scene.add(screenGlow);
        
        // Lamp light
        const lampLight = new THREE.PointLight(0xffffcc, 0.3, 1.5);
        lampLight.position.set(3.3, 2.4, -4.5);
        scene.add(lampLight);
        
        // ==================== THEME TOGGLE ====================
        
        let isNightMode = true;
        const themeToggle = document.getElementById('themeToggle');
        
        function setDayMode() {
            ambientLight.intensity = 0.7;
            mainLight.intensity = 1.3;
            fillLight.intensity = 0.5;
            pcRgbLight1.intensity = 0.2;
            pcRgbLight2.intensity = 0.15;
            screenGlow.intensity = 0.2;
            lampLight.intensity = 0.1;
            renderer.toneMappingExposure = 1.6;
            document.body.style.background = 'linear-gradient(135deg, #87CEEB 0%, #E0F6FF 100%)';
            themeToggle.textContent = '🌙 Modo Noche';
        }
        
        function setNightMode() {
            ambientLight.intensity = 0.35;
            mainLight.intensity = 0.9;
            fillLight.intensity = 0.3;
            pcRgbLight1.intensity = 0.6;
            pcRgbLight2.intensity = 0.4;
            screenGlow.intensity = 0.5;
            lampLight.intensity = 0.3;
            renderer.toneMappingExposure = 1.2;
            document.body.style.background = 'linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%)';
            themeToggle.textContent = '☀️ Modo Día';
        }
        
        themeToggle.addEventListener('click', () => {
            isNightMode = !isNightMode;
            isNightMode ? setNightMode() : setDayMode();
        });
        
        // ==================== ANIMATION ====================
        
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.025;
            
            // Animate RGB fans
            rgbFans.forEach((fan, i) => {
                const hue = (time * 0.4 + i * 0.15) % 1;
                fan.material.color.setHSL(hue, 1, 0.55);
            });
            
            // Animate RGB strip in PC
            rgbStrip.material.color.setHSL((time * 0.3 + 0.5) % 1, 1, 0.5);
            
            // Animate PC lights
            pcRgbLight1.color.setHSL((time * 0.25) % 1, 1, 0.5);
            pcRgbLight2.color.setHSL((time * 0.25 + 0.5) % 1, 1, 0.5);
            
            // Keyboard RGB layer animation
            kbRgbLayer.material.color.setHSL((time * 0.15) % 1, 1, 0.5);
            
            // Subtle screen flicker
            screenGlow.intensity = 0.45 + Math.sin(time * 2) * 0.08;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // ==================== RESIZE HANDLER ====================
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 1200);
        
        animate();
    </script>
</body>
</html>
