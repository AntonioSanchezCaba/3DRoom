<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Room in 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas {
            display: block;
        }
        
        .ui-overlay {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }
        
        .title {
            top: 30px;
            left: 40px;
            color: #fff;
        }
        
        .title h1 {
            font-family: 'Space Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #00d9ff, #ff00e5, #00d9ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s ease infinite;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
        }
        
        .title p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
            font-weight: 300;
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }
        
        .controls-hint {
            bottom: 30px;
            left: 40px;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }
        
        .controls-hint span {
            display: block;
            margin-bottom: 5px;
            font-family: 'Space Mono', monospace;
        }
        
        .controls-hint span::before {
            content: '→';
            margin-right: 10px;
            color: #00d9ff;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        .loading.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-text {
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            color: #00d9ff;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loading-bar::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #ff00e5);
            animation: loading-slide 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes loading-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 30px;
            right: 40px;
            z-index: 100;
            pointer-events: auto;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .view-toggle {
            top: 30px;
            bottom: auto;
        }

        .theme-toggle:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-text">Cargando habitación...</div>
        <div class="loading-bar"></div>
    </div>
    
    <div class="ui-overlay title">
        <h1>My Room in 3D</h1>
        <p>AMC's Workspace</p>
    </div>
    
    <div class="ui-overlay controls-hint">
        <span>Arrastra para rotar</span>
        <span>Scroll para zoom</span>
        <span>Click derecho para mover</span>
    </div>
    
    <button class="theme-toggle view-toggle" id="viewToggle">🏠 Vista general</button>
    <button class="theme-toggle" id="themeToggle">☀️ Modo Día</button>
    
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="js/core.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/objects/surfaces.js"></script>
    <script src="js/objects/desk.js"></script>
    <script src="js/objects/monitors.js"></script>
    <script src="js/objects/pc.js"></script>
    <script src="js/objects/peripherals.js"></script>
    <script src="js/objects/lamp.js"></script>
    <script src="js/objects/bookshelf.js"></script>
    <script src="js/objects/guitar.js"></script>
    <script src="js/objects/fan.js"></script>
    <script src="js/objects/chair.js"></script>
    <script src="js/objects/dumbbells.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
